name = "promedia-news"
main = "src/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Статичні файли (css, favicon, admin SPA) — усе, що не збігається
# з маршрутами воркера, віддається напряму з ./public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/article/*",
  "/tag/*",
  "/admin",
  "/"
]

[[d1_databases]]
binding = "DB"
database_name = "promedia-news"
database_id = "b5471e04-ad38-45d7-a306-0c6f8c47c14b"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "promedia-news-images"

# Кастомний домен — розкоментуйте й переконайтесь, що зона promedia.report
# є у вашому Cloudflare-акаунті (той самий, де вже є Worker submit-community.js).
[[routes]]
pattern = "news.promedia.report/*"
zone_name = "promedia.report"

# Секрети (НЕ в цьому файлі — задаються через `wrangler secret put`):
#   AUTH_SECRET      — довільний випадковий рядок (32+ символів) для підпису сесійних токенів
#   VAPID_PRIVATE_JWK — приватний ключ Web Push у форматі JWK
#   SUBDOMAINS_GITHUB_TOKEN — fine-grained GitHub token: Contents Read and write для GitHub-субдоменів
