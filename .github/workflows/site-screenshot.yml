name: Site screenshot

# Скриншот сторінки сайту для обкладинки новини (власний знімок ProMedia), результат — артефакт запуску.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Адреса сторінки"
        required: true
      width:
        description: "Ширина вікна"
        default: "1600"
      height:
        description: "Висота знімка"
        default: "900"
      open_lang_menu:
        description: "Відкрити список мов у шапці (true/false)"
        default: "false"

permissions:
  contents: read

jobs:
  shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Screenshot
        env:
          URL: ${{ inputs.url }}
          W: ${{ inputs.width }}
          H: ${{ inputs.height }}
          OPEN: ${{ inputs.open_lang_menu }}
        run: |
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: +process.env.W, height: +process.env.H }, deviceScaleFactor: 1 });
          await p.goto(process.env.URL, { waitUntil: "networkidle", timeout: 60000 });
          await p.evaluate(() => { document.querySelectorAll("#pm-language-suggest,#pm-memorial-overlay,.pm-analytics-notice,[class*=analytics-notice]").forEach(n => n.remove()); });
          if (process.env.OPEN === "true") { await p.click(".pm-global-lang > summary"); await p.mouse.move(5, 5); }
          await p.waitForTimeout(1500);
          await p.screenshot({ path: "screenshot.png" });
          await b.close();
          JS
          node shot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
