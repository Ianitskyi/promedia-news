name: Deploy ProMedia News Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promedia-news-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check credentials exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Ensure GA4 views cache exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0014_article_views.sql
      - name: Correct Horchynska article category
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0015_horchynska_article_category.sql
      - name: Shorten AI training article headline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0016_ai_training_headline.sql
      - name: Feature the winter story once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0017_feature_winter_story.sql
      - name: Add people tags to published articles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0019_people_tags.sql
      - name: Merge project tags «інструмент» into «інструменти»
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0020_merge_project_tool_tags.sql
      - name: New cover for the communities map project (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0021_communities_map_cover.sql
      - name: Communities map cover with Crimea
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0022_communities_map_cover_crimea.sql
      - name: Communities map cover with speech bubbles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0023_communities_map_cover_bubbles.sql
      - name: Communities map cover with people
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0024_communities_map_cover_people.sql
      - name: Card style — only «З фото на першій» and «Без фото на першій»
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0025_card_style_two_options.sql
      - name: Tags for the Zhanna Bezpiatchuk interview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0026_zhanna_bezpiatchuk_tags.sql
      - name: Tags for the Zhanna Bezpiatchuk interview (correct slug)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0027_zhanna_bezpiatchuk_tags_fix.sql
      - name: Restore the photo lead flag of the Zhanna Bezpiatchuk interview (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0028_zhanna_bezpiatchuk_hero_restore.sql
      - name: Hide Kyiv Independent lead photo on phones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0029_kyiv_independent_no_mobile_photo.sql
      - name: Bold names in the Viktoriia Hubareva interview (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0030_hubareva_interview_bold_names.sql
      - name: Ensure pinned-article column
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-article-pinned.mjs
      - name: Index for the pinned article
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0032_article_pinned_index.sql
      - name: Articles rubric is never «Важлива новина» (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute promedia-news --remote --file=migrations/0033_articles_rubric_not_important.sql
      - name: D1 usage — top queries by rows read (last 24h, diagnostic only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 insights promedia-news --timePeriod 1d --sort-type sum --sort-by reads --sort-direction DESC --limit 15
      - name: Ensure independent Crimean Tatar article covers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-article-crh-covers.mjs
      - name: Verify deployed D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const sql = "SELECT (SELECT COUNT(*) FROM pragma_table_info('articles') WHERE name IN ('cover_crop_data','cover_crop_data_en')) AS article_cols, (SELECT COUNT(*) FROM pragma_table_info('projects') WHERE name IN ('cover_crop_data','cover_crop_data_en','cover_image_url_en')) AS project_cols;";
          const text = execFileSync('npx',['wrangler','d1','execute','promedia-news','--remote','--command',sql],{encoding:'utf8'});
          const index=text.search(/\[\s*\{\s*"results"\s*:/);
          if(index<0)throw Error("Cannot parse D1 schema verification");
          const result=JSON.parse(text.slice(index).trim())[0].results[0];
          if(result.article_cols!==2 || result.project_cols!==3)throw Error('D1 schema is incomplete: '+JSON.stringify(result));
          console.log("D1 schema verified: articles=2, projects=3.");
          NODE
      - name: Projects — «Важливий на таймлайні» flag (once)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/apply-d1-project-timeline-key.mjs
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
      - name: Smoke test public site after deploy
        run: |
          set -e
          curl --fail --silent --show-error --location --max-time 30 https://news.promedia.report/admin/cover-editor.js | grep -q ProMediaCoverEditor
          curl --fail --silent --show-error --location --max-time 30 https://news.promedia.report/admin/projects.html | grep -q cover-editor.js
          echo "Production admin assets verified."
