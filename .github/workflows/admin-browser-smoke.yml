name: ProMedia browser smoke test
on:
  pull_request:
    paths:
      - 'public/admin/**'
      - 'public/css/**'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/admin-browser-smoke.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - run: node tests/admin-integration.mjs
