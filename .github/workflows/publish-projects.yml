name: Publish approved projects

# Publishes editorially approved project cards committed to content/projects/*.json.
# Idempotent: existing slugs are skipped, so admin-panel edits are never overwritten.
on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
      - 'scripts/publish-project-from-json.mjs'
      - '.github/workflows/publish-projects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promedia-production-d1-schema
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Publish new projects
        env:
          CI: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-project-from-json.mjs content/projects
