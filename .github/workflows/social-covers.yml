name: Social covers (1200×630)

# Вертикальні обкладинки соцмережі ріжуть по центру — робимо окрему картинку
# з урахуванням точки фокусу. Щогодини, після публікацій і вручну.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_run:
    workflows: ['Publish approved articles', 'Deploy ProMedia News Worker']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/social-covers.mjs'
      - '.github/workflows/social-covers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promedia-social-covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm i --no-save sharp
      - name: Make social covers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/social-covers.mjs
      - name: Commit and deploy new covers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p public/img/social && git add public/img/social
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -m "Обкладинки для соцмереж (1200×630)"
            git pull --rebase origin main && git push origin main
            npx wrangler deploy --keep-vars
          fi
      - name: Record covers in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/social-covers.mjs --apply
