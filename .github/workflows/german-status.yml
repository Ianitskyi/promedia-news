name: German translation status

# Діагностика німецької версії (26.11.2026): стан автоперекладу, помилки, що віддає сайт.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Public status and pages
        run: |
          echo "== /api/translation-status"; curl -s https://news.promedia.report/api/translation-status; echo
          echo "== /de/ (HTTP, lang, articles)"; curl -s -o /tmp/de.html -w "%{http_code}\n" https://news.promedia.report/de/; grep -o '<html lang="[a-z]*"' /tmp/de.html; grep -c 'article-card' /tmp/de.html || true
          echo "== shell has the language list"; curl -s https://news.promedia.report/js/promedia-global-shell.js | grep -c 'pm-global-lang-list' || true
          curl -sI https://news.promedia.report/js/promedia-global-shell.js | grep -i 'cache-control\|age:' || true
      - name: D1 — translation state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute promedia-news --remote --command "SELECT key, value FROM scheduler_state"
          npx wrangler d1 execute promedia-news --remote --command "SELECT kind, item_id, failed_at, error FROM translation_errors ORDER BY failed_at DESC LIMIT 10"
          npx wrangler d1 execute promedia-news --remote --command "SELECT COUNT(*) AS articles_de FROM articles WHERE title_de IS NOT NULL AND title_de != ''"
          npx wrangler d1 execute promedia-news --remote --command "SELECT COUNT(*) AS projects_de FROM projects WHERE title_de IS NOT NULL AND title_de != ''"
