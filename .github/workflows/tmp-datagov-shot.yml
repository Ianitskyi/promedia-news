name: tmp data.gov.ua screenshot
on:
  push:
    branches: [tmp-datagov-shot]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: |
          cat > /tmp/shot.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1600, height: 900 }, deviceScaleFactor: 1, locale: 'uk-UA' });
          await p.goto("https://data.gov.ua/", { waitUntil: "networkidle", timeout: 60000 });
          await p.waitForTimeout(2500);
          await p.screenshot({ path: "shot-datagov.png" });
          await b.close();
          JS
          cp /tmp/shot.mjs ./shot.mjs && node shot.mjs && rm shot.mjs
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add shot-datagov.png && git commit -m "tmp screenshot" && git push origin tmp-datagov-shot
