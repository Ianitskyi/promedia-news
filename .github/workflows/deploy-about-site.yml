name: Deploy about.promedia.report

# Сайт «Про нас» ГО «ПроМедіа»: статичні файли з about-site/public розгортаються як воркер promedia-about.
on:
  push:
    branches: [main]
    paths:
      - 'about-site/**'
      - '.github/workflows/deploy-about-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promedia-about-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Deploy about worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config about-site/wrangler.toml 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=about site URL::${url:-workers.dev URL not found in wrangler output}"
      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          set -e
          sleep 5
          base="${{ steps.deploy.outputs.url }}"
          for p in / /assets/logo.svg /assets/team/yanitskyi-andriy.jpg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base$p?smoke=$GITHUB_RUN_ID")
            echo "$p -> $code"; test "$code" = 200
          done
          curl -fsS --max-time 30 "$base/?smoke=$GITHUB_RUN_ID" | grep -q 'id="history"'
