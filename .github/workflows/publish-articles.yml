name: Publish approved articles

# Publishes editorially approved articles committed to content/articles/*.json.
# Idempotent: existing slugs are skipped, so admin-panel edits are never overwritten.
on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'content/related-media.json'
      - 'scripts/publish-article-from-json.mjs'
      - 'src/lib/pinning.js'
      - '.github/workflows/publish-articles.yml'
  workflow_dispatch:
  # Publishes articles whose "publishAt" time has come (GitHub may start a scheduled run a few minutes late).
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: promedia-production-d1-schema
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Scheduled runs do real work only when an article's "publishAt" fell within the last hour.
      - name: Check for articles due now
        id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e '
            const fs = require("fs"), now = Date.now();
            const due = fs.readdirSync("content/articles").filter(f => f.endsWith(".json")).some(f => {
              const t = Date.parse(JSON.parse(fs.readFileSync("content/articles/" + f, "utf8")).publishAt || "");
              return t <= now && t > now - 60 * 60 * 1000;
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "run=" + due + "\n");
          '
      - if: steps.due.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: steps.due.outputs.run == 'true'
        run: npm ci
      - if: steps.due.outputs.run == 'true'
        name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - if: steps.due.outputs.run == 'true'
        name: Ensure pinned-article columns (pinned_at, pinned_until)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-article-pinned.mjs
      - if: steps.due.outputs.run == 'true'
        name: Publish new articles
        env:
          CI: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-article-from-json.mjs content/articles
      # Сторінки новин за останні 3 дні: відкриваються (UK/EN) і мають картку «Люди в матеріалі»
      # для кожної людини з досьє (правило Андрія Яніцького, 28.11.2026). Падає, якщо картки бракує.
      - if: steps.due.outputs.run == 'true'
        name: Check dossier cards on recent pages
        run: sleep 20 && node scripts/check-article-pages.mjs
      - if: steps.due.outputs.run == 'true'
        name: Check public pages
        run: |
          for f in content/articles/*.json; do
            slug=$(node -e "console.log(require('./$f').slug)")
            for prefix in "" "/en" "/crh"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://news.promedia.report${prefix}/article/${slug}" || true)
              echo "${prefix:-/uk} /article/${slug}: ${code}"
            done
          done
