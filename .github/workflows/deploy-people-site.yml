name: Deploy people.promedia.report

# Сайт досьє «Люди ПроМедіа». Збирається з people/data/*.json, фото шукає у Вікіпедії/Вікісховищі
# (лише вільні ліцензії) і розгортається як окремий воркер promedia-people.
on:
  push:
    branches: [main]
    paths:
      - 'people/**'
      - 'people-site/**'
      - 'archive/published-news.json'
      - 'content/articles/**'
      - '.github/workflows/deploy-people-site.yml'
  schedule:
    - cron: '41 4 * * 1'   # щопонеділка оновлюємо фото й згадки
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promedia-people-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check that the news index matches people/data
        run: |
          node people-site/build.mjs --index-only
          git diff --exit-code src/data/people-index.js || { echo "::error::src/data/people-index.js застарів — запустіть node people-site/build.mjs --index-only"; exit 1; }
      - name: Build the site
        run: node people-site/build.mjs
      - name: Deploy people worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config people-site/wrangler.toml
      - name: Smoke test
        run: |
          set -e
          sleep 5
          base="https://promedia-people.ianitskyi.workers.dev"
          for p in / /en/ /anna-babinets/ /api/people.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base$p?smoke=$GITHUB_RUN_ID")
            echo "$p -> $code"; test "$code" = 200
          done
          curl -fsS --max-time 30 "$base/?smoke=$GITHUB_RUN_ID" | grep -q 'id="pp-grid"'
