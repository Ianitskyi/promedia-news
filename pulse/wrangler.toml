# «Пульс ПроМедіа» — відвідуваність сайтів ПроМедіа в реальному часі з Google Analytics 4.
#  - кожні 5 хвилин перевіряє GA4 і пише в Telegram лише тоді, коли трафік незвично зростає;
#  - щодня ввечері надсилає короткий підсумок дня;
#  - працює як конектор (MCP) для Claude: дашборд і питання «що зараз на сайті?».
# Секрети (ключ сервісного акаунта Google, токен бота) вводяться один раз на сторінці /setup
# і зберігаються в D1 (таблиця pulse_kv). У репозиторії їх немає.
# Адреса: https://promedia-pulse.a-ianitskyi.workers.dev
name = "promedia-pulse"
main = "worker.js"
compatibility_date = "2026-10-06"
workers_dev = true

# stat.promedia.report — закрита сторінка статистики для команди
routes = [{ pattern = "stat.promedia.report", custom_domain = true }]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "promedia-news"
database_id = "b5471e04-ad38-45d7-a306-0c6f8c47c14b"

[vars]
GA_PROPERTY_ID = "366614690"
# Сервісний акаунт у Google Cloud (проєкт promedia-pulse); ключ — власний, приватна частина лише в D1
GA_SA_EMAIL = "pulse-894@promedia-pulse.iam.gserviceaccount.com"
GA_KEY_ID = "a422b16f45e1fea39b75031415a330abdce0c106"
# У скільки разів трафік має перевищити звичайний рівень, щоб прийшла тривога
ALERT_MULTIPLIER = "3"
# Мінімум людей на сайтах за останні 5 хвилин, нижче якого тривог не буває
ALERT_MIN_USERS = "10"
# О котрій (за Києвом) надсилати підсумок дня; порожньо — не надсилати
DAILY_SUMMARY_HOUR = "21"
# Тихі години за Києвом, напр. "0-7"; порожньо — без тихих годин
QUIET_HOURS = ""
# SHA-256 коду налаштування (сам код є лише в Андрія)
# Хто може входити на stat.promedia.report (крім користувачів адмінки новин): адреси або «@домен» через кому
# OAuth-клієнт «Увійти через Google» (проєкт promedia-pulse); ID клієнта публічний
GOOGLE_CLIENT_ID = "477587252663-m1ubgcvkd45lqqa3ulsdjghia1umimss.apps.googleusercontent.com"
STAT_ALLOWED = "a.ianitskyi@gmail.com,@promedia.report"
SETUP_HASH = "7d671abc00ea70231b0f1d81f33299d6af1bea151385ef1ed126845f6992645d"
